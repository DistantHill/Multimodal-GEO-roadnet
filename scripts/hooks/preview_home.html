<!doctype html>
<html lang="zh-CN">
<head>
<meta charset="utf-8"><meta name="viewport" content="width=device-width, initial-scale=1">
<title>预览工作台 · Preview Studio</title>
<style>
:root{color-scheme:light;--bg:#f4f5f1;--ink:#1e302e;--muted:#788581;--line:#dfe5dd;--green:#176b55;--side:#152e29}*{box-sizing:border-box}body{margin:0;background:var(--bg);color:var(--ink);font-family:Inter,"Segoe UI","Microsoft YaHei",sans-serif;font-size:14px}button,input,select{font:inherit}button,a,input,select{-webkit-tap-highlight-color:transparent}button{cursor:pointer}button:focus-visible,a:focus-visible,input:focus-visible,select:focus-visible{outline:3px solid #7cd5af;outline-offset:3px}.layout{display:grid;grid-template-columns:252px 1fr;min-height:100vh}.sidebar{background:var(--side);color:#e6eee8;padding:34px 22px;display:flex;flex-direction:column;position:sticky;top:0;height:100vh}.brand{display:flex;align-items:center;gap:12px;font-weight:650;font-size:18px;letter-spacing:-.5px}.brand-mark{display:grid;place-items:center;width:38px;height:38px;border:1px solid #638277;border-radius:12px;color:#b7e2c5;font-family:monospace;font-size:18px}.brand-sub{color:#8ca69d;font-size:11px;letter-spacing:2px;margin-top:7px}.nav-label{margin:50px 12px 14px;color:#8ca69d;font-size:10px;letter-spacing:2px}.projects{display:flex;flex-direction:column;gap:7px}.project-btn{border:0;background:none;color:#abc1b7;display:flex;align-items:center;gap:10px;text-align:left;padding:13px 12px;border-radius:9px;width:100%}.project-btn:hover{background:#203d34}.project-btn.active{background:#2c4c40;color:#effbec}.project-btn .name{flex:1;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}.project-btn .count{font-size:11px;background:#ffffff12;border-radius:5px;padding:3px 6px}.dot{width:7px;height:7px;border-radius:50%;background:#8daa94;flex-shrink:0}.side-footer{margin-top:auto;padding:24px 10px 0;color:#91aaa0;line-height:1.8;font-size:12px}.status{display:flex;align-items:center;gap:8px;color:#c6decf}.status .dot{background:#8ccca7;box-shadow:0 0 0 4px #8ccca713}.main{padding:30px 48px 45px;max-width:1600px;width:100%;margin:auto}.topbar{display:flex;justify-content:space-between;align-items:center;color:var(--muted);font-size:12px;margin-bottom:46px}.topbar strong{color:var(--ink);font-weight:500}.refresh{border:1px solid var(--line);border-radius:8px;background:#fff;padding:8px 14px;color:#435f52}.refresh:hover{border-color:#88b29b}.eyebrow{font-size:11px;font-weight:650;letter-spacing:2px;color:var(--green);margin-bottom:12px}.hero{display:flex;align-items:flex-end;justify-content:space-between;gap:20px;margin-bottom:32px}h1{font-size:38px;letter-spacing:-1.7px;line-height:1.2;margin:0 0 14px;font-weight:650}.hero p{margin:0;color:#6c7e74;line-height:1.8}.stats{display:flex;gap:35px;padding-bottom:4px}.stat strong{display:block;font-size:30px;letter-spacing:-1px;font-weight:550}.stat span{display:block;margin-top:7px;font-size:11px;color:#6c7e74;white-space:nowrap}.toolbar{display:flex;justify-content:space-between;gap:14px;align-items:center;margin-bottom:24px}.search-box{position:relative;flex:1;max-width:480px}.search-box svg{position:absolute;left:15px;top:14px;color:#8b9a90}.search-box input{width:100%;padding:13px 15px 13px 42px;border:1px solid var(--line);background:#fff;border-radius:10px;color:var(--ink)}input::placeholder{color:#8b9a90}.sort{padding:12px 14px;border:1px solid var(--line);border-radius:10px;background:transparent;color:#586e61}.section-head{display:flex;align-items:center;gap:10px;margin-bottom:16px}.section-head h2{font-size:14px;margin:0;font-weight:600}.section-head span{font-size:11px;color:var(--muted)}.grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(275px,1fr));gap:18px}.card{border:1px solid var(--line);border-radius:14px;overflow:hidden;background:#fff;transition:transform .18s,box-shadow .18s}.card:hover{transform:translateY(-3px);box-shadow:0 10px 24px #213e2b0a}.cover{height:132px;background:#e8eee5;position:relative;overflow:hidden;padding:20px 22px}.cover.v1{background:#eeeae0}.cover.v2{background:#e3ebed}.cover.v3{background:#eee5e2}.cover-label{position:relative;z-index:2;font-size:10px;letter-spacing:2px;color:#6b8070}.cover-mark{position:absolute;right:24px;bottom:14px;color:#617963;font-family:monospace;font-size:49px;letter-spacing:-8px;opacity:.38}.cover-lines{position:absolute;left:22px;bottom:23px;display:flex;gap:4px;align-items:flex-end;height:36px}.cover-lines i{display:block;width:7px;background:#899c823a;border-radius:2px}.cover-circle{position:absolute;height:150px;width:150px;border:1px solid #80907926;border-radius:50%;right:-23px;top:12px}.cover-circle:after{content:"";position:absolute;inset:18px;border:1px solid #80907926;border-radius:50%}.card-body{padding:19px 20px}.badge{color:var(--green);font-size:10px;display:inline-block;padding:4px 7px;border-radius:4px;background:#edf4ed;margin-bottom:10px;max-width:100%;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}.card h3{font-size:16px;line-height:1.6;margin:0 0 9px;font-weight:600;display:-webkit-box;-webkit-line-clamp:2;-webkit-box-orient:vertical;overflow:hidden;min-height:51px}.file-name{display:block;color:#8c9890;font-size:11px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;margin-bottom:16px}.meta{display:flex;justify-content:space-between;color:#819087;font-size:10px;padding-bottom:16px}.actions{display:flex;gap:8px;border-top:1px solid #edf0e9;padding-top:14px}.open{display:flex;align-items:center;justify-content:center;gap:8px;flex:1;color:var(--green);background:#edf4ed;border-radius:7px;text-decoration:none;padding:10px;font-size:12px;font-weight:550}.open:hover{background:#dfeddf}.copy{background:#fff;border:1px solid var(--line);color:#738779;border-radius:7px;padding:7px 11px;display:grid;place-items:center}.copy:hover{background:#f4f7f1}.empty{padding:70px 20px;text-align:center;border:1px dashed #cfdbce;border-radius:14px;color:#7c8e80;grid-column:1/-1}.empty strong{display:block;color:#435e4b;margin-bottom:12px;font-size:18px}.footer{display:flex;justify-content:space-between;gap:15px;margin-top:32px;color:#94a096;font-size:11px}.toast{position:fixed;bottom:28px;left:50%;transform:translateX(-50%);background:var(--side);color:#f1faf1;padding:12px 20px;border-radius:10px;box-shadow:0 4px 20px #152e2925;opacity:0;pointer-events:none;transition:opacity .2s}.toast.show{opacity:1}.notice{padding:12px 16px;border-radius:9px;background:#f7e9dc;color:#94663e;line-height:1.6;margin-bottom:20px}.hidden{display:none}@media(min-width:1500px){.grid{grid-template-columns:repeat(3,1fr)}}@media(max-width:1000px){.layout{grid-template-columns:210px 1fr}.main{padding:28px}.sidebar{padding:28px 15px}.hero{align-items:flex-start}.stats{gap:20px}h1{font-size:31px}}@media(max-width:720px){.layout{display:block}.sidebar{position:relative;height:auto;padding:20px}.brand-sub,.nav-label,.side-footer{display:none}.projects{flex-direction:row;overflow:auto;margin-top:20px;gap:8px}.project-btn{width:auto;flex-shrink:0;max-width:220px;padding:10px}.main{padding:24px 20px}.topbar{margin-bottom:28px}.hero{display:block}.stats{margin-top:25px;gap:35px}.stat strong{font-size:24px}.toolbar{align-items:stretch}.sort{max-width:126px}.grid{grid-template-columns:1fr}.footer{flex-direction:column}}@media(prefers-reduced-motion:reduce){*{transition:none!important}}
</style>
</head>
<body>
<div class="layout">
<aside class="sidebar"><div class="brand"><span class="brand-mark">&lt;/&gt;</span><div>Preview Studio<div class="brand-sub">预览工作台</div></div></div><div class="nav-label">WORKSPACES / 项目</div><nav id="projects" class="projects" aria-label="项目筛选"></nav><div class="side-footer"><div class="status"><span class="dot"></span><span id="status">正在连接服务</span></div><div>所有项目 · 一个入口</div></div></aside>
<main class="main">
<div class="topbar"><span>工作空间 <span style="margin:0 10px;color:#bdc9bd">/</span> <strong>HTML 产物</strong></span><button id="refresh" class="refresh">↻ &nbsp;刷新</button></div>
<header class="hero"><div><div class="eyebrow">YOUR WORK, READY TO VIEW</div><h1>每一份成果，触手可及。</h1><p>汇集各项目的报告、可视化与页面，随时打开最新版本。</p></div><div class="stats"><div class="stat"><strong id="total">—</strong><span>可预览文件</span></div><div class="stat"><strong id="project-total">—</strong><span>已接入项目</span></div></div></header>
<div id="notice" class="notice hidden" role="alert"></div>
<div class="toolbar"><label class="search-box"><svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" aria-hidden="true"><circle cx="10.5" cy="10.5" r="6.5"/><path d="m16 16 5 5"/></svg><input id="search" type="search" aria-label="搜索预览文件" placeholder="搜索标题、文件或项目…"></label><select id="sort" class="sort" aria-label="排序方式"><option value="updated">最近更新</option><option value="name">标题 A → Z</option></select></div>
<div class="section-head"><h2 id="section-title">全部产物</h2><span id="result-count"></span></div><div id="grid" class="grid" aria-live="polite"><div class="empty">正在加载预览文件…</div></div>
<footer class="footer"><span>Preview Studio · 多项目预览</span><span id="updated">每 30 秒自动同步</span></footer>
</main></div><div id="toast" class="toast" role="status"></div>
<script>
const $ = (id) => document.getElementById(id);
let projects = [], selected = '', lastLoaded = 0;
const copyIcon = '<svg width="15" height="15" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.6" aria-hidden="true"><rect x="8" y="8" width="12" height="12" rx="2"/><path d="M16 8V4a2 2 0 0 0-2-2H4a2 2 0 0 0-2 2v10a2 2 0 0 0 2 2h4"/></svg>';
function el(tag, cls, text) { const node = document.createElement(tag); if (cls) node.className = cls; if (text !== undefined) node.textContent = text; return node; }
function toast(text) { $('toast').textContent = text; $('toast').classList.add('show'); clearTimeout(toast.timer); toast.timer = setTimeout(() => $('toast').classList.remove('show'), 2400); }
function nav() {
  $('projects').replaceChildren();
  const entries = [{id:'', name:'全部项目', files:projects.flatMap(p => p.files)}, ...projects];
  for (const p of entries) { const b = el('button', 'project-btn' + (selected === p.id ? ' active' : '')); b.setAttribute('aria-pressed', String(selected === p.id)); b.append(el('span','dot'), el('span','name',p.name), el('span','count',String(p.files.length))); b.onclick = () => { selected = p.id; nav(); render(); }; $('projects').append(b); }
}
function render() {
  const term = $('search').value.toLocaleLowerCase().trim();
  const files = projects.filter(p => !selected || p.id === selected).flatMap(p => p.files.map(f => ({...f, project:p.name})));
  const visible = files.filter(f => `${f.title} ${f.name} ${f.project}`.toLocaleLowerCase().includes(term));
  visible.sort($('sort').value === 'name' ? (a,b) => a.title.localeCompare(b.title,'zh-CN') : (a,b) => b.updated-a.updated);
  $('section-title').textContent = selected ? projects.find(p => p.id === selected)?.name || '项目产物' : '全部产物';
  $('result-count').textContent = `${visible.length} 份文件`;
  $('grid').replaceChildren();
  if (!visible.length) { const empty = el('div','empty'); empty.append(el('strong','',term ? '没有匹配的文件' : '还没有预览文件'), el('span','',term ? '试试其他关键词，或切换项目。' : '项目生成 HTML 后，会自动出现在这里。')); $('grid').append(empty); }
  visible.forEach((f,i) => {
    const card = el('article','card'), cover = el('div',`cover v${i%4}`); cover.setAttribute('aria-hidden','true'); cover.append(el('span','cover-label','HTML DOCUMENT'), el('div','cover-circle'), el('div','cover-mark','</>'));
    const lines = el('div','cover-lines'); [16,24,19,32,26,36,28,34].forEach(h => { const bar = el('i'); bar.style.height = h+'px'; lines.append(bar); }); cover.append(lines);
    const body = el('div','card-body'), title = el('h3','',f.title), path = el('span','file-name',` ${f.name} `); title.title = f.title; path.title = ` ${f.name} `;
    body.append(el('span','badge',f.project),title,path);
    const meta = el('div','meta'); meta.append(el('span','',new Date(f.updated*1000).toLocaleString('zh-CN',{month:'2-digit',day:'2-digit',hour:'2-digit',minute:'2-digit'})),el('span','',f.size < 1024 ? f.size+' B' : (f.size/1024).toFixed(1)+' KB')); body.append(meta);
    const actions = el('div','actions'), open = el('a','open','打开预览 ↗'), copy = el('button','copy'); open.href = f.url; open.target = '_blank'; open.rel = 'noopener'; copy.innerHTML = copyIcon; copy.title = '复制链接'; copy.setAttribute('aria-label','复制 '+f.title+' 的链接');
    copy.onclick = async () => { const link = new URL(f.url,location.origin).href; try { if (navigator.clipboard && window.isSecureContext) await navigator.clipboard.writeText(link); else { const input = el('textarea'); input.value=link; input.style.position='fixed'; input.style.opacity='0'; document.body.append(input); input.select(); const ok=document.execCommand('copy'); input.remove(); if (!ok) throw new Error(); } toast('链接已复制'); } catch { toast('复制失败，请从预览页地址栏复制'); } };
    actions.append(open,copy); body.append(actions); card.append(cover,body); $('grid').append(card);
  });
}
async function load() {
  $('refresh').disabled = true;
  try { const response = await fetch('/api/projects',{cache:'no-store'}); if (!response.ok) throw new Error(); projects = await response.json(); if (selected && !projects.some(p => p.id === selected)) selected=''; $('total').textContent = projects.reduce((n,p) => n+p.files.length,0); $('project-total').textContent = projects.length; $('status').textContent='预览服务已连接'; $('notice').classList.add('hidden'); lastLoaded=Date.now(); $('updated').textContent='同步于 '+new Date(lastLoaded).toLocaleTimeString('zh-CN')+' · 每 30 秒自动同步'; nav(); render(); }
  catch { $('status').textContent='暂时无法连接'; $('notice').textContent='无法同步预览文件，请检查连接后点击刷新。'; $('notice').classList.remove('hidden'); if (!lastLoaded) $('grid').replaceChildren(el('div','empty','预览服务暂不可用')); }
  finally { $('refresh').disabled=false; }
}
$('search').addEventListener('input',render); $('sort').addEventListener('change',render); $('refresh').addEventListener('click',load); load(); setInterval(() => { if (!document.hidden) load(); },30000);
</script>
</body></html>
