name: roadnet-prod

services:
  postgres:
    image: postgis/postgis:16-3.4
    environment:
      POSTGRES_DB: ${POSTGRES_DB:-roadnet}
      POSTGRES_USER: ${POSTGRES_USER:-roadnet}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?POSTGRES_PASSWORD must be set}
    volumes:
      - postgres_data:/var/lib/postgresql/data
      - ../../db/postgres/init:/docker-entrypoint-initdb.d:ro
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U $${POSTGRES_USER} -d $${POSTGRES_DB}"]
      interval: 5s
      timeout: 5s
      retries: 10

  qdrant:
    image: qdrant/qdrant:v1.13.6
    volumes:
      - qdrant_data:/qdrant/storage
    healthcheck:
      # The minimal Qdrant image has no curl/wget; the Backend performs the HTTP check.
      test: ["CMD-SHELL", "kill -0 1"]
      interval: 5s
      timeout: 5s
      retries: 10

  backend:
    build:
      context: ../../apps/backend
      dockerfile: Dockerfile
    environment:
      POSTGRES_HOST: postgres
      POSTGRES_PORT: 5432
      POSTGRES_DB: ${POSTGRES_DB:-roadnet}
      POSTGRES_USER: ${POSTGRES_USER:-roadnet}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?POSTGRES_PASSWORD must be set}
      QDRANT_HOST: qdrant
      QDRANT_PORT: 6333
    command: ["uvicorn", "backend.main:app", "--host", "0.0.0.0", "--port", "8000"]
    expose:
      - "8000"
    depends_on:
      postgres:
        condition: service_healthy
      qdrant:
        condition: service_healthy

  pipeline:
    build:
      context: ../../services/pipeline
      dockerfile: Dockerfile
    environment:
      DATA_ROOT: /data
      PARQUET_ROOT: /data/parquet
      TRACK_LOG_PATH: ${PIPELINE_LOG_PATH:-/data/logs/pipeline.log}
      POSTGRES_HOST: postgres
      POSTGRES_PORT: 5432
      POSTGRES_DB: ${POSTGRES_DB:-roadnet}
      POSTGRES_USER: ${POSTGRES_USER:-roadnet}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?POSTGRES_PASSWORD must be set}
      QDRANT_HOST: qdrant
      QDRANT_PORT: 6333
    volumes:
      - ${DATA_ROOT:?DATA_ROOT must point to an external runtime data directory}:/data
    command: ["python", "-m", "pipeline", "serve"]
    depends_on:
      postgres:
        condition: service_healthy
      qdrant:
        condition: service_healthy

  frontend:
    build:
      context: ../../apps/frontend
      dockerfile: Dockerfile
    ports:
      - "${FRONTEND_PORT:-8080}:80"
    depends_on:
      - backend

volumes:
  postgres_data:
  qdrant_data:
