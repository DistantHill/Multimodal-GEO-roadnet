name: roadnet-prod

services:
  backend:
    build:
      context: ../../apps/backend
      dockerfile: Dockerfile
      additional_contexts:
        pipeline_source: ../../services/pipeline
    environment:
      POSTGRES_HOST: postgres
      POSTGRES_PORT: 5432
      POSTGRES_DB: ${POSTGRES_DB:-roadnet}
      POSTGRES_USER: ${POSTGRES_USER:-roadnet}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?POSTGRES_PASSWORD must be set}
      QDRANT_HOST: qdrant
      QDRANT_PORT: 6333
    command: ["uvicorn", "backend.main:app", "--host", "0.0.0.0", "--port", "8000"]
    expose:
      - "8000"
    networks:
      - default
      - roadnet_services

  pipeline:
    build:
      context: ../../services/pipeline
      dockerfile: Dockerfile
    environment:
      DATA_ROOT: /data
      PARQUET_ROOT: /data/parquet
      TRACK_LOG_DIR: /data/logs
      POSTGRES_HOST: postgres
      POSTGRES_PORT: 5432
      POSTGRES_DB: ${POSTGRES_DB:-roadnet}
      POSTGRES_USER: ${POSTGRES_USER:-roadnet}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?POSTGRES_PASSWORD must be set}
      QDRANT_HOST: qdrant
      QDRANT_PORT: 6333
    volumes:
      - ${DATA_ROOT:?DATA_ROOT must point to an external runtime data directory}:/data
      - ${PARQUET_ROOT:-${DATA_ROOT}/parquet}:/data/parquet
      - ${PIPELINE_LOG_DIR:-${DATA_ROOT}/logs}:/data/logs
    command: ["python", "-m", "pipeline", "serve"]
    networks:
      - default
      - roadnet_services

  vision:
    profiles: ["vision"]
    build:
      context: ../../services/vision
      dockerfile: Dockerfile
    image: roadnet-vision-yolov8:8.3.0-cu117
    ipc: host
    gpus: all
    working_dir: /workspace
    volumes:
      - ${MODEL_ROOT:?MODEL_ROOT must point to an external model directory}:/models:ro
      - ${DATA_ROOT:?DATA_ROOT must point to an external runtime data directory}:/data
    command:
      - yolo
      - predict
      - model=/models/yolo/yolov8n.pt
      - source=/data/vision/input
      - device=${YOLO_DEVICE:-0}
      - imgsz=${YOLO_IMGSZ:-640}
      - batch=${YOLO_BATCH:-1}
      - half=${YOLO_HALF:-True}
      - conf=${YOLO_CONF:-0.25}
      - save=True
      - project=/data/vision/output
      - name=yolov8n-640
      - exist_ok=True

  frontend:
    build:
      context: ../../apps/frontend
      dockerfile: Dockerfile
    ports:
      - "${FRONTEND_PORT:-8080}:80"
    depends_on:
      - backend

networks:
  roadnet_services:
    external: true
    name: ${ROADNET_SERVICES_NETWORK:-roadnet-services}
