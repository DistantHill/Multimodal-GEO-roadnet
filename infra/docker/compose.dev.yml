name: roadnet-dev

services:
  backend:
    build:
      context: ../../apps/backend
      dockerfile: Dockerfile
      additional_contexts:
        pipeline_source: ../../services/pipeline
    environment:
      BACKEND_CONFIG_PATH: ${BACKEND_CONFIG_PATH:-/app/config/backend.toml}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-change-me}
    volumes:
      - ../../apps/backend:/app
      - ../../services/pipeline/src:/opt/pipeline/src:ro
    command: ["uvicorn", "backend.main:app", "--host", "0.0.0.0", "--port", "8000", "--reload"]
    ports:
      - "${BACKEND_PORT:-8000}:8000"
    networks:
      - default
      - roadnet_services

  pipeline:
    build:
      context: ../../services/pipeline
      dockerfile: Dockerfile
    environment:
      PIPELINE_CONFIG_PATH: ${PIPELINE_CONFIG_PATH:-/app/config/pipeline.toml}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-change-me}
    volumes:
      - ../../services/pipeline:/app
      - ../../scripts/cv_human_check:/app/scripts/cv_human_check:ro
      - ${DATA_ROOT:-/data/tmp/road-network}:/data
      - ${PARQUET_ROOT:-${DATA_ROOT:-/data/tmp/road-network}/parquet}:/data/parquet
      - ${PIPELINE_LOG_DIR:-${DATA_ROOT:-/data/tmp/road-network}/logs}:/data/logs
    command: ["python", "-m", "pipeline", "serve"]
    networks:
      - default
      - roadnet_services

  vision:
    profiles: ["vision"]
    build:
      context: ../../services/vision
      dockerfile: Dockerfile
    image: roadnet-vision-yolov8:8.3.0-cu117
    ipc: host
    gpus: all
    working_dir: /workspace
    volumes:
      - ${MODEL_ROOT:-../../models}:/models:ro
      - ${DATA_ROOT:-/data/tmp/road-network}:/data
    command:
      - yolo
      - predict
      - model=/models/yolo/yolov8n.pt
      - source=/data/vision/input
      - device=${YOLO_DEVICE:-0}
      - imgsz=${YOLO_IMGSZ:-640}
      - batch=${YOLO_BATCH:-1}
      - half=${YOLO_HALF:-True}
      - conf=${YOLO_CONF:-0.25}
      - save=True
      - project=/data/vision/output
      - name=yolov8n-640
      - exist_ok=True

  frontend:
    build:
      context: ../../apps/frontend
      dockerfile: Dockerfile
      target: dev
    environment:
      VITE_API_BASE_URL: /api
    volumes:
      - ../../apps/frontend:/app
      - frontend_node_modules:/app/node_modules
    command: ["npm", "run", "dev", "--", "--host", "0.0.0.0"]
    ports:
      - "${FRONTEND_PORT:-5173}:5173"
    depends_on:
      - backend

volumes:
  frontend_node_modules:

networks:
  roadnet_services:
    external: true
    name: ${ROADNET_SERVICES_NETWORK:-roadnet-services}
