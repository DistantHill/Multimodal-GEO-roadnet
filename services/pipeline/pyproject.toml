[build-system]
requires = ["setuptools==80.9.0"]
build-backend = "setuptools.build_meta"

[project]
name = "roadnet-pipeline"
version = "0.1.0"
description = "Independent freight trajectory road-network pipeline runtime"
requires-python = ">=3.12"
dependencies = [
    "duckdb>=1.5.5,<1.6",
    "numpy>=2.0",
    "Pillow>=10.0",
    "polars>=1.44.2,<1.45",
    "psycopg[binary]>=3.2",
    "pyproj>=3.7,<4",
    "rasterio>=1.4,<2",
    "rich>=13.0",
    "shapely>=2.0,<3",
]

[project.optional-dependencies]
dev = ["pytest>=8,<9"]

[project.scripts]
roadnet-pipeline = "pipeline.__main__:main"
roadnet-pipeline-init-db = "track.v2.cli.init_db:main"

[tool.setuptools.packages.find]
where = ["src"]
