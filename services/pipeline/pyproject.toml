[build-system]
requires = ["setuptools>=80,<85", "pybind11>=3,<4", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "roadnet-pipeline"
version = "0.2.0"
description = "Native road-network extraction and parameter experiment workbench"
requires-python = ">=3.12"
dependencies = [
    "duckdb>=1.5,<3",
    "numpy>=2,<3",
    "optuna>=4.5,<6",
    "pyarrow>=19,<27",
    "pyogrio>=0.11,<0.14",
    "pyproj>=3.7,<4",
    "shapely>=2.1,<3",
    "scipy>=1.13,<2",
    "tomlkit>=0.13,<1",
]

[project.optional-dependencies]
dev = ["pytest>=8,<10"]
postgres = ["psycopg[binary]>=3.2,<4"]
legacy = ["polars>=1.44.2,<1.45", "scikit-learn>=1.3,<2", "Pillow>=10", "rasterio>=1.4,<2", "rich>=13", "psycopg[binary]>=3.2,<4", "sqlalchemy>=2,<3"]

[project.scripts]
roadnet-pipeline = "pipeline.__main__:main"
roadnet-pipeline-legacy = "pipeline.legacy:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests/workbench"]
