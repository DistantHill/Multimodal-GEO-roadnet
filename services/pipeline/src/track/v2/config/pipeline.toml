# 集中式 pipeline 配置 —— v2 运行时所有可调参数。
# 键名与各阶段 dataclass 字段一一对应；默认值与代码 dataclass 默认一致（零行为变更）。
# Centralized pipeline config — all tunable v2 runtime parameters.
# Keys mirror the stage dataclass fields; defaults match the in-code dataclass
# defaults exactly (no behavior change).

# processing_srid is intentionally not defaulted here. Supply it in a regional
# config (or with --processing-srid) after validating the full data coverage.
[projection]
source_srid = 4326
enforce_area_of_use = true
max_scale_error = 0.01

[refine]
max_extension_m = 80.0
min_heading_delta_deg = 80.0
max_heading_delta_deg = 100.0
max_gap_s = 120.0
min_speed_mps = 0.3
max_stationary_duration_s = 300.0
excluded_sample_max = 50

[detect]
use_turn_events = true
use_cross_track_candidates = true
turn_window = 2
min_turn_deg = 45.0
max_turn_deg = 170.0
min_leg_m = 35.0
min_movement_speed_mps = 1.5
g_star_radius_m = 180.0
g_star_min_z = 0.5
dbscan_eps_m_turn = 140.0
dbscan_min_samples_turn = 4
cross_track_straightness_deg = 15.0
cross_track_min_angle_deg = 80.0
cross_track_max_angle_deg = 100.0
cross_track_dbscan_eps_m = 100.0
cross_track_dbscan_min_samples = 3
cross_track_grid_cell_m = 100.0
cross_track_pair_batch_size = 65536
cross_track_max_grid_cells_per_segment = 25
merge_centroid_distance_m = 80.0
min_intersection_radius_m = 90.0
topology_radius_padding_m = 70.0
branch_threshold_deg = 35.0
min_branches = 3
min_observations = 6
min_directed_transitions = 3
bearing_window = 2
spatial_window_size = [2000.0, 2000.0]
spatial_window_overlap = 0.15
stream_batch_size = 1000

[clip]
include_boundary_clips = true

[fitting]
point_spacing_m = 50.0
fit_sample_spacing_m = 10.0
min_clips_per_pair = 1

[network]
include_isolated_nodes = true

[runtime]
db_insert_batch = 5000
import_batch_size = 10000
csv_max_field_size = 10485760
encoding_sample_size = 65536
encoding_confidence = 0.5
default_text_encoding = "utf-8-sig"
fallback_encodings = ["gb18030", "gbk", "cp936", "big5"]
mark_flush_every_n = 2000
excluded_flush_threshold = 2000
refine_flush_point_threshold = 100000
progress_interval = 500
progress_time_threshold_s = 2.0
duckdb_memory_limit = "1GB"
duckdb_threads = 4
# Initial operational default; calibrate against the 26M benchmark.
duckdb_max_temp_directory_size = "50GB"
# Apply POLARS_MAX_THREADS before the first Polars import in engine integration.
polars_threads = 4
# Zero delegates sizing to the engine until benchmark evidence is available.
parquet_target_file_size_bytes = 0
parquet_row_group_size_rows = 0
artifact_gc_grace_days = 7
