# Default field specifications for track.v2 Parser 0.
# Each [[field]] entry maps one canonical field to source column aliases.
#
# canonical    = internal name used by all downstream code
# aliases      = list of possible source column names (first match wins)
# required     = if true, this field MUST be mapped (missing → ERROR or FieldSelectionRequired)
# type         = "str" | "float" | "int" | "timestamp"
# unit_scale   = multiplier applied to the raw value after parsing
# default      = fallback value when field is missing and required=false
# extra        = if true, store in TrajectoryPoint.extra dict (not a core field)
#
# Core fields: point_ref, vehicle_id, timestamp, lon, lat, heading, speed, extra

[quality]
sample_errors_max = 50
max_consecutive_errors = 50
max_error_ratio = 1.0

[[field]]
canonical = "vehicle_id"
aliases = ["vid", "vehicle_id", "veh_id", "vehicleid"]
required = true
type = "str"

[[field]]
canonical = "lon"
aliases = ["lng", "lon", "longitude", "x"]
required = true
type = "float"

[[field]]
canonical = "lat"
aliases = ["lat", "latitude", "y"]
required = true
type = "float"

[[field]]
canonical = "heading"
aliases = ["included_angle", "heading", "heading_deg", "direction", "bearing", "angle"]
required = false
type = "float"
unit_scale = 1.0
default = 0.0

[[field]]
canonical = "speed"
aliases = ["gps_speed", "speed", "speed_kmh", "velocity", "spd"]
required = false
type = "float"
unit_scale = 0.277778   # km/h → m/s
default = 0.0

[[field]]
canonical = "timestamp"
aliases = ["gps_time_a", "gps_time", "gps_timestamp_ms", "standard_time", "time", "timestamp", "observed_at"]
required = true
type = "timestamp"

[[field]]
canonical = "road_id"
aliases = ["road_id", "road_id_suite", "roadid"]
required = false
type = "str"
extra = true

[[field]]
canonical = "altitude"
aliases = ["altitude", "alt", "elevation"]
required = false
type = "float"
extra = true

[[field]]
canonical = "vss_speed"
aliases = ["vss_speed"]
required = false
type = "float"
extra = true
