# Pipeline 完整配置；所有改动均须重启 Pipeline。每个键的注释含用途、单位/范围及语义影响。
[postgres]
host = "postgres" # 数据库主机；非空；部署语义。
port = 5432 # 数据库端口；1..65535；部署语义。
database = "roadnet_test" # 数据库名；非空；部署语义。
user = "roadnet" # 数据库用户；非空；部署语义。密码仅来自 POSTGRES_PASSWORD。
connect_timeout = 10 # 连接超时；秒，>=1；执行语义。
sslmode = "prefer" # libpq SSL 模式；部署语义。
keepalives = true # 启用 TCP keepalive；布尔；执行语义。
keepalives_idle = 60 # 首次探测前空闲；秒，>=1；执行语义。
keepalives_interval = 10 # 探测间隔；秒，>=1；执行语义。
keepalives_count = 5 # 失败探测次数；>=1；执行语义。
tcp_user_timeout = 30000 # TCP 未确认超时；毫秒，>=0；执行语义。

[paths]
data_root = "/data" # 运行数据根目录；绝对非根路径；部署语义。
parquet_directory = "/data/parquet" # Parquet 目录；绝对路径；部署语义。
duckdb_postgres_extension_path = "/opt/duckdb/extensions/v1.5.5/linux_amd64/postgres_scanner.duckdb_extension" # DuckDB 扩展；绝对文件；部署语义。

[logging]
directory = "/data/logs" # 日志目录；相对路径按本 TOML 所在目录解析；执行语义。

[projection]
source_srid = 4326 # 输入坐标系 EPSG；正整数；算法语义。
processing_srid = 32649 # 处理坐标系 EPSG；正整数；算法语义。
enforce_area_of_use = true # 强制投影适用区；布尔；算法语义。
max_scale_error = 0.01 # 最大比例误差；0..1；算法语义。

[parser]
field_specs_path = "field_specs.toml" # 字段映射文件；相对本 TOML；解析语义。

[refine]
max_extension_m = 80.0 # 补点最大延伸；米，>0；算法语义。
min_heading_delta_deg = 80.0 # 最小航向差；度，0..180；算法语义。
max_heading_delta_deg = 100.0 # 最大航向差；度，0..180；算法语义。
max_gap_s = 120.0 # 轨迹最大时间间隔；秒，>0；算法语义。
min_speed_mps = 0.3 # 最低移动速度；米/秒，>=0；算法语义。
max_stationary_duration_s = 300.0 # 最长静止时长；秒，>=0；算法语义。
excluded_sample_max = 50 # 排除样本留存数；>=1；执行语义。

[detect]
use_turn_events = true # 使用转向事件；布尔；算法语义。
use_cross_track_candidates = true # 使用交叉轨迹候选；布尔；算法语义。
turn_window = 2 # 转向窗口半径；点数，>=1；算法语义。
min_turn_deg = 45.0 # 最小转角；度，0..180；算法语义。
max_turn_deg = 170.0 # 最大转角；度，0..180；算法语义。
min_leg_m = 35.0 # 转向边最短长度；米，>0；算法语义。
min_movement_speed_mps = 1.5 # 最低移动速度；米/秒，>=0；算法语义。
g_star_radius_m = 180.0 # G* 搜索半径；米，>0；算法语义。
g_star_min_z = 0.5 # G* 最低 Z 分数；有限数；算法语义。
dbscan_eps_m_turn = 140.0 # 转向 DBSCAN 半径；米，>0；算法语义。
dbscan_min_samples_turn = 4 # 转向 DBSCAN 最少样本；>=1；算法语义。
cross_track_straightness_deg = 15.0 # 直线容差；度，0..180；算法语义。
cross_track_min_angle_deg = 80.0 # 交叉最小夹角；度，0..180；算法语义。
cross_track_max_angle_deg = 100.0 # 交叉最大夹角；度，0..180；算法语义。
cross_track_dbscan_eps_m = 100.0 # 交叉 DBSCAN 半径；米，>0；算法语义。
cross_track_dbscan_min_samples = 3 # 交叉 DBSCAN 最少样本；>=1；算法语义。
cross_track_grid_cell_m = 100.0 # 空间网格边长；米，>0；算法及执行语义。
cross_track_pair_batch_size = 65536 # 线段对批大小；>=1；执行语义。
cross_track_max_grid_cells_per_segment = 25 # 单线段最大网格数；>=1；执行语义。
cross_track_task_grid_m = 5000.0 # 跨轨迹任务网格边长；米，>0；算法语义。
cross_track_task_threads = 4 # 跨轨迹任务线程数；1..8；执行语义。
merge_centroid_distance_m = 80.0 # 聚类合并距离；米，>=0；算法语义。
min_intersection_radius_m = 90.0 # 最小路口半径；米，>0；算法语义。
topology_radius_padding_m = 70.0 # 拓扑半径增量；米，>=0；算法语义。
branch_threshold_deg = 35.0 # 分支角阈值；度，0..180；算法语义。
min_branches = 3 # 最少分支；>=1；算法语义。
min_observations = 6 # 最少观测；>=1；算法语义。
min_directed_transitions = 3 # 最少有向转移；>=1；算法语义。
bearing_window = 2 # 方位窗口；点数，>=1；算法语义。
spatial_window_size = [2000.0, 2000.0] # 空间窗口宽高；米，均>0；执行语义。
spatial_window_overlap = 0.15 # 窗口重叠比例；0..1；算法及执行语义。
stream_batch_size = 1000 # 流批大小；>=1；执行语义。

[clip]
include_boundary_clips = true # 保留边界 Clip；布尔；算法语义。

[fitting]
point_spacing_m = 50.0 # 输出点间距；米，>0；算法语义。
fit_sample_spacing_m = 10.0 # 拟合采样间距；米，>0；算法语义。
min_clips_per_pair = 1 # 每连接对最少 Clip；>=1；算法语义。

[network]
include_isolated_nodes = true # 输出孤立节点；布尔；算法语义。

[runtime]
db_insert_batch = 5000 # DB 写入批大小；>=1；执行语义。
db_stream_batch_size = 2000 # DB 服务端游标读取批大小；>=1；执行语义。
relation_batch_size = 1024 # DuckDB 中间关系读写批大小；>=1；执行语义。
parquet_read_batch_size = 4096 # Parquet 读取批大小；>=1；执行语义。
validation_batch_size = 2000 # 校验与语义对比读取批大小；>=1；执行语义。
import_batch_size = 10000 # 导入批大小；>=1；执行语义。
csv_max_field_size = 10485760 # CSV 最大字段；字节，>=1；执行语义。
encoding_sample_size = 65536 # 编码探测样本；字节，>=1；执行语义。
encoding_confidence = 0.5 # 编码置信阈值；0..1；执行语义。
default_text_encoding = "utf-8-sig" # 默认编码；非空；解析语义。
fallback_encodings = ["gb18030", "gbk", "cp936", "big5"] # 回退编码顺序；非空列表；解析语义。
mark_flush_every_n = 2000 # 标记刷新间隔；>=1；执行语义。
excluded_flush_threshold = 2000 # 排除项刷新阈值；>=1；执行语义。
refine_flush_point_threshold = 100000 # Refine 点刷新阈值；>=1；执行语义。
progress_interval = 500 # 进度计数间隔；>=1；执行语义。
progress_time_threshold_s = 2.0 # 进度时间间隔；秒，>0；执行语义。
duckdb_memory_limit = "1GB" # DuckDB 内存限制；容量字符串；执行语义。
duckdb_event_memory_limit = "4GB" # Detect Turn/Cross 事件关系各自的 DuckDB 内存上限；其余实例沿用 duckdb_memory_limit。
duckdb_grid_memory_limit = "4GB" # Detect grid 线段 TEMP 关系各自的 DuckDB 内存上限；其他实例沿用公共限制。
duckdb_threads = 4 # DuckDB 线程；1..4；执行语义。
duckdb_max_temp_directory_size = "50GB" # DuckDB 临时盘上限；容量字符串；执行语义。
polars_threads = 4 # Polars 线程；>=1；执行语义。
parquet_target_file_size_bytes = 0 # Parquet 目标文件大小；字节，0 表示引擎决定；执行语义。
parquet_row_group_size_rows = 0 # Parquet 行组大小；行数，0 表示引擎决定；执行语义。
artifact_gc_grace_days = 7 # 产物 GC 宽限期；天，>=1；执行语义。

[resources]
verify_artifact_sha256 = false # 读取产物时校验 SHA-256；布尔；执行语义。

[raster]
resolution_m = 10.0
count_mode = "raw"
point_kernel = "none"
clip_quantile = 0.95
quantile_method = "linear"
normalizer = "sqrt"
channel_encoder = "gray_repeat"
tile_size_px = 1024
overlap_px = 256
edge_mode = "pad"
materialize_rgb_geotiff = false
stream_batch_size = 10000
block_size_px = 512
max_cells = 100000000
memory_budget_bytes = 1073741824
